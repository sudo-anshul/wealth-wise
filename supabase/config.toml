project_id = "wealthwise"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/update-password", "http://localhost:3000/auth/confirm", "http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/auth/callback?next=/update-password", "http://127.0.0.1:3000/auth/confirm"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
