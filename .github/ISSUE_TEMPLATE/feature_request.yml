name: Feature request
description: Suggest a focused improvement to WealthWise.
title: "feature: "
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
      description: Describe a concrete workflow or problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain the outcome and any useful examples or alternatives.
    validations:
      required: true
